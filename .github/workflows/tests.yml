name: Resume screening validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q src app.py
      - name: Run synthetic ranking evaluation
        run: python src/evaluate.py
      - name: Upload synthetic evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: rolefit-synthetic-ranking-evaluation
          path: reports/ranking_evaluation.json
          if-no-files-found: error
